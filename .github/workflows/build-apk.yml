name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Version output: $JAVA_VERSION_OUTPUT"

          # Extract major version number (e.g. "17.0.x" -> 17 or "1.8.x" -> 8)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | sed -E -n 's/.*version "([^".]+).*/\1/p')
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | sed -E -n 's/.*version "1\.([^".]+).*/\1/p')
          fi

          echo "Detected Java Major Version: '$JAVA_MAJOR'"

          if [ -z "$JAVA_MAJOR" ] || ! [ "$JAVA_MAJOR" -eq "$JAVA_MAJOR" ] 2>/dev/null; then
            echo "ERROR: Could not detect active Java major version."
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than the required minimum version 17."
            exit 1
          fi

          echo "Java environment verified successfully (version: $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Keystore already exists at $KEYSTORE_PATH."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "$KEYSTORE_PATH" ]; then
              echo "ERROR: Failed to generate temporary debug keystore at $KEYSTORE_PATH."
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            echo "Searching discovered APKs inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -type f
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file at $EXPECTED_APK is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "ERROR: $EXPECTED_APK does not have .apk extension."
            exit 1
          fi

          echo "Confirmed valid debug APK at $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d -t apk-release-XXXXXX)
          REPO_RAW="${GITHUB_REPOSITORY##*/}"
          # Sanitize repository name to safe characters (alphanumeric, dash, underscore)
          SAFE_REPO_NAME=$(echo "$REPO_RAW" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_RELEASE_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $DEST_PATH"
            exit 1
          fi

          echo "Release asset prepared: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or invalid: '$ASSET_PATH'"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          RELEASE_NOTES=$(cat <<EOF
          ### Debug APK Build #${{ github.run_number }}

          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${TARGET_COMMIT}
          - **Notice**: This APK is intended for testing purposes and is not a Play Store production release.
          - **Signing**: Signed with a temporary debug keystore for development/testing installation.
          EOF
          )

          echo "Creating release $RELEASE_TAG for commit $TARGET_COMMIT..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$TARGET_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$RELEASE_TAG" || true

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"

            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Asset**: \`$ASSET_NAME\`"
              echo ""
              echo "Directly download the APK file from the **Assets** section of the [GitHub Release]($RELEASE_URL)."
              echo ""
              echo "> ℹ️ **Backup**: The standard GitHub Actions artifact named \`app-debug-apk\` is also available on this run's summary page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation did not succeed (outcome: $RELEASE_STATUS)."
            echo "The debug APK build and GitHub Actions artifact upload succeeded."
            echo "The artifact named 'app-debug-apk' is preserved and available for download."

            {
              echo "## ⚠️ Debug APK Build Succeeded (Release Warning)"
              echo ""
              echo "The debug APK was built successfully and uploaded as a GitHub Actions artifact."
              echo "However, automated release publication encountered an issue or was skipped."
              echo ""
              echo "You can download the APK directly from the **Artifacts** section below (\`app-debug-apk\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
